<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TourneyNotes — Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a1628;
      color: #e8edf5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      text-align: center;
      max-width: 480px;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .logo span { color: #38bdf8; }

    .tagline {
      font-size: 1.1rem;
      color: #8899b0;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: rgba(56,189,248,.1);
      border: 1px solid rgba(56,189,248,.3);
      color: #38bdf8;
      border-radius: 20px;
      padding: .4rem 1rem;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Tourney<span>Notes</span></div>
    <p class="tagline">Tournament rules, field info, and hotel details — organized and ready for game day.</p>
    <span class="badge">Coming Soon</span>
  </div>
</body>
</html>
